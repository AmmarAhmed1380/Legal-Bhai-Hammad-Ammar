name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: legalbahi
          POSTGRES_DB: legalbahi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d legalbahi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:legalbahi@127.0.0.1:5432/legalbahi_test
      DATABASE_URL: postgresql://postgres:legalbahi@127.0.0.1:5432/legalbahi_test
      PGPASSWORD: legalbahi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run migrate
      - run: npm run migrate
      - run: npm run test:api
      - run: npm --workspace @wakeel/api run typecheck
      - run: npm --workspace @wakeel/web run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web:e2e
      - run: npm --workspace @wakeel/mobile exec tsc -- --noEmit
      - run: npm run test:mobile:flows
      - run: npm run test:deployment
      - run: npm --workspace @wakeel/mobile exec expo export -- --platform android --output-dir dist-ci
      - name: Verify PostgreSQL dump and restore
        run: |
          pg_dump --format=custom --no-owner --file=/tmp/legalbahi.dump "$DATABASE_URL"
          createdb --host=127.0.0.1 --username=postgres legalbahi_restore
          pg_restore --no-owner --dbname=postgresql://postgres:legalbahi@127.0.0.1:5432/legalbahi_restore /tmp/legalbahi.dump
          psql postgresql://postgres:legalbahi@127.0.0.1:5432/legalbahi_restore --set ON_ERROR_STOP=1 --command "SELECT COUNT(*) FROM schema_migrations"

  deployment-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse deployment PowerShell
        shell: pwsh
        run: |
          $AllErrors = @()
          Get-ChildItem infra/windows/*.ps1 | ForEach-Object {
            $Tokens = $null
            $ParseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$Tokens, [ref]$ParseErrors) | Out-Null
            $AllErrors += $ParseErrors
          }
          if ($AllErrors.Count -gt 0) {
            throw ($AllErrors | ForEach-Object Message | Out-String)
          }
      - name: Confirm example environment fails production preflight
        shell: pwsh
        run: |
          try {
            & .\infra\windows\validate-production.ps1 -EnvironmentFile .\.env.example -Root .
            throw "Expected placeholder environment validation to fail"
          } catch {
            if ($_.Exception.Message -eq "Expected placeholder environment validation to fail") {
              throw
            }
            Write-Host "Production preflight rejected the example environment as expected"
          }
