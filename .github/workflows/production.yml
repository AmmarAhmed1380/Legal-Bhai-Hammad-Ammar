name: Production verify

on:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: legalbahi
          POSTGRES_DB: legalbahi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d legalbahi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:legalbahi@127.0.0.1:5432/legalbahi_test
      DATABASE_URL: postgresql://postgres:legalbahi@127.0.0.1:5432/legalbahi_test
      PGPASSWORD: legalbahi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      - run: npm run verify
