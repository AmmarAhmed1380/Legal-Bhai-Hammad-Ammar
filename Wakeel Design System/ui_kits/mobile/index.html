<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<title>Wakeel Mobile · UI Kit</title>
<link rel="stylesheet" href="../../colors_and_type.css"/>
<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  html,body { margin:0; background: linear-gradient(180deg,#eceae4,#d9d5cb); min-height:100vh; }
  body { display:flex; align-items:flex-start; justify-content:center; padding:40px 20px; font-family: var(--font-sans); }
  .phone {
    width: 390px; height: 844px; background: var(--background);
    border-radius: 48px; overflow: hidden; position: relative;
    box-shadow: 0 30px 80px rgba(44,44,42,0.25), 0 0 0 12px #1a1a1a, 0 0 0 14px #333;
  }
  .phone .notch { position:absolute; top:10px; left:50%; transform:translateX(-50%); width:120px; height:32px; background:#000; border-radius:999px; z-index:10;}
  .screen { height: 100%; display:flex; flex-direction:column; }
</style>
</head>
<body>
<div class="phone">
  <div class="notch"></div>
  <div class="screen" id="root"></div>
</div>
<script type="text/babel" src="./components.jsx"></script>
<script type="text/babel" src="./Login.jsx"></script>
<script type="text/babel" src="./Home.jsx"></script>
<script type="text/babel" src="./CaseDetail.jsx"></script>
<script type="text/babel" src="./HearingUpload.jsx"></script>
<script type="text/babel">
const { useState, useEffect } = React;

function App() {
  const [route, setRoute] = useState("login");
  const [record, setRecord] = useState(null);
  useEffect(() => { lucide.createIcons(); }, [route]);

  let content;
  if (route === "login") content = <Login onEnter={() => setRoute("home")}/>;
  else if (route === "home") content = <Home onOpenCase={r => { setRecord(r); setRoute("detail"); }}/>;
  else if (route === "detail") content = <CaseDetail record={record} onBack={() => setRoute("home")} onOpenUpload={() => setRoute("upload")} onOpenSms={() => setRoute("sms")}/>;
  else if (route === "upload") content = <HearingUpload record={record} onBack={() => setRoute("detail")} onSaved={() => setRoute("detail")}/>;
  else if (route === "sms") content = <SmsPreviewScreen record={record} onBack={() => setRoute("detail")}/>;

  return (
    <div data-screen-label={`Mobile · ${route}`} style={{ height: "100%", display: "flex", flexDirection: "column" }}>
      <StatusBar/>
      <div style={{ flex: 1, overflow: "hidden", position: "relative" }}>{content}</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
