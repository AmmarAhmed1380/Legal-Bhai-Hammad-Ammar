<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;background:var(--surface);}
  body{padding:22px;display:flex;flex-direction:column;gap:10px;}
  .row{display:flex;gap:16px;align-items:center;flex-wrap:wrap;}
  .block{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .lbl{font-size:10.5px;font-family:var(--font-mono);color:var(--fg3);}
  .bar{height:6px;width:160px;background:linear-gradient(90deg,var(--primary) 0%,var(--primary-light) 100%);border-radius:3px;}
  .note{font-size:11px;color:var(--fg2);}
  svg{display:block;}
</style>
</head>
<body>
<div class="row">
  <div class="block"><div class="bar"></div><span class="lbl">200ms ease-out</span></div>
  <div class="block"><svg width="80" height="40" viewBox="0 0 80 40"><path d="M2 38 C 20 38, 20 2, 78 2" stroke="#0F6E56" stroke-width="2" fill="none"/></svg><span class="lbl">cubic-bezier(.2,.8,.2,1)</span></div>
</div>
<div class="note">All transitions 200ms, capped at 300ms. Press: scale(0.98). Card tap: opacity 0.7. No color flash. Loading uses skeletons, not spinners.</div>
</body>
</html>
