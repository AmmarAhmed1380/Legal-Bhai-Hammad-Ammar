<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;background:var(--surface);}
  body{padding:20px;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .sw{display:flex;flex-direction:column;border-radius:10px;overflow:hidden;border:1px solid var(--border);}
  .chip{height:56px;}
  .meta{padding:8px 10px;display:flex;flex-direction:column;gap:2px;background:var(--surface);}
  .name{font-weight:600;font-size:12px;color:var(--fg1);}
  .hex{font-family:var(--font-mono);font-size:10.5px;color:var(--fg2);}
  .role{font-size:10.5px;color:var(--fg3);}
</style>
</head>
<body>
<div class="grid">
  <div class="sw"><div class="chip" style="background:#F8F7F3"></div><div class="meta"><span class="name">Background</span><span class="hex">#F8F7F3</span><span class="role">App canvas</span></div></div>
  <div class="sw"><div class="chip" style="background:#FFFFFF;box-shadow:inset 0 0 0 1px #E8E6E1"></div><div class="meta"><span class="name">Surface</span><span class="hex">#FFFFFF</span><span class="role">Cards, inputs</span></div></div>
  <div class="sw"><div class="chip" style="background:#FBFAF7;box-shadow:inset 0 0 0 1px #E8E6E1"></div><div class="meta"><span class="name">Surface Muted</span><span class="hex">#FBFAF7</span><span class="role">Hint panels</span></div></div>
  <div class="sw"><div class="chip" style="background:#2C2C2A"></div><div class="meta"><span class="name">Text Primary</span><span class="hex">#2C2C2A</span><span class="role">Body &amp; headings</span></div></div>
  <div class="sw"><div class="chip" style="background:#5F5E5A"></div><div class="meta"><span class="name">Text Secondary</span><span class="hex">#5F5E5A</span><span class="role">Metadata</span></div></div>
  <div class="sw"><div class="chip" style="background:#B4B2A9"></div><div class="meta"><span class="name">Text Tertiary</span><span class="hex">#B4B2A9</span><span class="role">Timestamps</span></div></div>
  <div class="sw" style="grid-column:span 3;"><div class="chip" style="background:#E8E6E1;height:22px"></div><div class="meta"><span class="name">Border</span><span class="hex">#E8E6E1</span><span class="role">Dividers, card outlines — 0.5–1px</span></div></div>
</div>
</body>
</html>
