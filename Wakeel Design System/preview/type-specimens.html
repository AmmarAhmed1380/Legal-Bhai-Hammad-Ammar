<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;background:var(--surface);}
  body{padding:22px;display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  .block{display:flex;flex-direction:column;gap:6px;}
  .lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.1em;color:var(--fg3);}
  .sans{font-family:var(--font-sans);font-size:22px;color:var(--fg1);}
  .serif{font-family:var(--font-display);font-size:30px;color:var(--fg1);font-weight:600;letter-spacing:-0.01em;}
  .mono{font-family:var(--font-mono);font-size:18px;color:var(--fg1);font-weight:600;}
  .urdu{font-family:var(--font-urdu);direction:rtl;font-size:22px;line-height:2;color:var(--fg1);}
</style>
</head>
<body>
<div class="block"><div class="lbl">Plus Jakarta Sans · UI</div><div class="sans">Case heard, next date 14 May.</div></div>
<div class="block"><div class="lbl">Source Serif 4 · Display</div><div class="serif">Wakeel</div></div>
<div class="block"><div class="lbl">JetBrains Mono · Case numbers</div><div class="mono">W.P. 2076/2019</div></div>
<div class="block"><div class="lbl">Noto Nastaliq Urdu · Client SMS</div><div class="urdu">آپ کا مقدمہ مورخہ 14 مئی کو ہے</div></div>
</body>
</html>
