<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;background:var(--background);}
  body{padding:26px;display:flex;gap:20px;align-items:center;flex-wrap:wrap;}
  .tile{background:#fff;width:170px;height:80px;border-radius:14px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--fg2);}
  .t1{box-shadow:var(--shadow-card);}
  .t2{box-shadow:var(--shadow-modal);}
  .t3{outline:2px solid var(--primary);outline-offset:1px;}
  .cap{font-size:10.5px;color:var(--fg3);margin-top:8px;font-family:var(--font-mono);text-align:center;}
  .col{display:flex;flex-direction:column;align-items:center;}
</style>
</head>
<body>
<div class="col"><div class="tile t1">card</div><div class="cap">0 10 30 rgba(15,110,86,.05)</div></div>
<div class="col"><div class="tile t2">modal</div><div class="cap">0 22 60 rgba(44,44,42,.16)</div></div>
<div class="col"><div class="tile t3">focus ring</div><div class="cap">2px solid primary</div></div>
</body>
</html>
