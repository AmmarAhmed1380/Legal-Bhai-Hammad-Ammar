<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;background:var(--surface);}
  body{padding:20px;}
  .row{display:flex;align-items:flex-end;gap:14px;}
  .bar{background:var(--primary-light);border:1px solid rgba(15,110,86,0.15);border-radius:6px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;}
  .tok{font-family:var(--font-mono);font-size:10.5px;color:var(--fg3);margin-top:6px;display:block;text-align:center;}
  .val{font-size:11px;color:var(--fg1);font-weight:600;display:block;text-align:center;}
</style>
</head>
<body>
<div class="row">
  <div><div class="bar" style="width:20px;height:4px"></div><span class="val">4</span><span class="tok">space-1</span></div>
  <div><div class="bar" style="width:28px;height:8px"></div><span class="val">8</span><span class="tok">space-2</span></div>
  <div><div class="bar" style="width:36px;height:12px"></div><span class="val">12</span><span class="tok">space-3</span></div>
  <div><div class="bar" style="width:44px;height:16px"></div><span class="val">16</span><span class="tok">space-4</span></div>
  <div><div class="bar" style="width:52px;height:20px"></div><span class="val">20</span><span class="tok">space-5</span></div>
  <div><div class="bar" style="width:60px;height:24px"></div><span class="val">24</span><span class="tok">space-6</span></div>
  <div><div class="bar" style="width:72px;height:32px"></div><span class="val">32</span><span class="tok">space-8</span></div>
</div>
</body>
</html>
