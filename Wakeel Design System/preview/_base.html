<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin:0; padding:0; background:var(--surface); }
  body { padding: var(--space-5); }
  .card-pad { padding: var(--space-5); }
  .row { display:flex; gap: var(--space-4); align-items:center; flex-wrap:wrap; }
  .col { display:flex; flex-direction:column; gap: var(--space-2); }
  .grid { display:grid; gap: var(--space-3); }
  .swatch { display:flex; align-items:stretch; border-radius: var(--radius-md); overflow:hidden; border:1px solid var(--border); background:var(--surface); }
  .swatch .chip { width: 56px; }
  .swatch .meta { padding: 10px 12px; display:flex; flex-direction:column; gap: 2px; flex:1; }
  .swatch .name { font-weight: 600; font-size: 13px; color: var(--fg1); }
  .swatch .hex { font-family: var(--font-mono); font-size: 11px; color: var(--fg2); }
  .swatch .role { font-size: 11px; color: var(--fg3); }
</style>
</head>
<body></body>
</html>
