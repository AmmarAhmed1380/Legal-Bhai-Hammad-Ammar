<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;background:var(--surface);}
  body{padding:22px;}
  .tl{position:relative;padding-left:28px;display:flex;flex-direction:column;gap:16px;}
  .tl::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:1px;background:var(--border);}
  .item{position:relative;}
  .dot{position:absolute;left:-24px;top:6px;width:10px;height:10px;border-radius:9999px;background:var(--primary);box-shadow:0 0 0 3px #fff;}
  .date{font-family:var(--font-mono);font-size:12px;color:var(--fg2);font-weight:600;}
  .out{font-size:14px;font-weight:700;color:var(--fg1);margin-top:2px;}
  .notes{font-size:13px;color:var(--fg2);line-height:18px;margin-top:2px;}
  .ocr{font-size:11px;color:var(--fg3);margin-top:4px;font-family:var(--font-mono);}
</style>
</head>
<body>
<div class="tl">
  <div class="item"><span class="dot"></span><div class="date">2026-04-18</div><div class="out">Order passed</div><div class="notes">Matter taken up, adjourned for arguments.</div><div class="ocr">OCR: completed · Next 2026-05-14</div></div>
  <div class="item"><span class="dot" style="background:var(--fg3)"></span><div class="date">2026-03-04</div><div class="out">Hearing adjourned</div><div class="notes">Counsel for respondent sought time.</div><div class="ocr">OCR: pending_config</div></div>
</div>
</body>
</html>
