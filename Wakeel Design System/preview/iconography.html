<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.js"></script>
<style>
  html,body{margin:0;background:var(--surface);}
  body{padding:22px;display:flex;flex-direction:column;gap:14px;}
  .row{display:flex;gap:18px;flex-wrap:wrap;align-items:center;}
  .ico{display:flex;flex-direction:column;align-items:center;gap:4px;width:68px;}
  .ico i{width:22px;height:22px;color:var(--fg1);}
  .ico.active i{color:var(--primary);}
  .lbl{font-size:10.5px;color:var(--fg3);font-family:var(--font-mono);}
  .note{font-size:12px;color:var(--fg2);}
</style>
</head>
<body>
<div class="note">Lucide · stroke-based · 1.5px · 22px on mobile tab bar. No emoji. No custom SVGs.</div>
<div class="row">
  <div class="ico active"><i data-lucide="home"></i><span class="lbl">home</span></div>
  <div class="ico"><i data-lucide="folder"></i><span class="lbl">cases</span></div>
  <div class="ico"><i data-lucide="calendar"></i><span class="lbl">calendar</span></div>
  <div class="ico"><i data-lucide="bell"></i><span class="lbl">alerts</span></div>
  <div class="ico"><i data-lucide="camera"></i><span class="lbl">camera</span></div>
  <div class="ico"><i data-lucide="refresh-cw"></i><span class="lbl">sync</span></div>
  <div class="ico"><i data-lucide="share-2"></i><span class="lbl">share</span></div>
  <div class="ico"><i data-lucide="scale"></i><span class="lbl">brand</span></div>
  <div class="ico"><i data-lucide="message-square"></i><span class="lbl">sms</span></div>
  <div class="ico"><i data-lucide="search"></i><span class="lbl">search</span></div>
</div>
<script>lucide.createIcons();</script>
</body>
</html>
