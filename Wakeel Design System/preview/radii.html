<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;background:var(--surface);}
  body{padding:22px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;}
  .tile{background:var(--primary-light);border:1px solid rgba(15,110,86,0.18);width:78px;height:78px;display:flex;align-items:flex-end;justify-content:center;padding:6px;}
  .tok{font-family:var(--font-mono);font-size:10.5px;color:var(--fg3);}
  .block{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .name{font-size:11px;color:var(--fg1);font-weight:600;}
</style>
</head>
<body>
<div class="block"><div class="tile" style="border-radius:6px"></div><div class="name">pills</div><span class="tok">radius-sm · 6</span></div>
<div class="block"><div class="tile" style="border-radius:10px"></div><div class="name">buttons, inputs</div><span class="tok">radius-md · 10</span></div>
<div class="block"><div class="tile" style="border-radius:14px"></div><div class="name">cards</div><span class="tok">radius-lg · 14</span></div>
<div class="block"><div class="tile" style="border-radius:18px"></div><div class="name">panels</div><span class="tok">radius-xl · 18</span></div>
<div class="block"><div class="tile" style="border-radius:9999px;width:78px;height:34px"></div><div class="name">chips, avatars</div><span class="tok">radius-full</span></div>
</body>
</html>
