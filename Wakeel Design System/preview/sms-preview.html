<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;background:var(--surface);}
  body{padding:22px;display:flex;flex-direction:column;gap:12px;max-width:520px;}
  .sms{border:1px solid var(--border);border-radius:14px;padding:14px 16px;background:#FBFAF7;}
  .lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.12em;color:var(--primary);margin-bottom:6px;}
  .en{font-size:13px;line-height:20px;color:var(--fg1);}
  .ur{font-family:var(--font-urdu);direction:rtl;font-size:16px;line-height:2.2;color:var(--fg1);margin-top:8px;}
</style>
</head>
<body>
<div class="sms">
  <div class="lbl">Post-hearing · preview only</div>
  <div class="en">Dear Ahmed Zubair, your case W.P. 2076/2019 was heard today. Next date: 14 May. Status: Arguments concluded, reserved for order. — Wakeel demo</div>
</div>
<div class="sms">
  <div class="lbl">Reminder · Urdu preview</div>
  <div class="ur">آپ کا مقدمہ W.P. 2076/2019 مورخہ 14 مئی کو اسلام آباد ہائی کورٹ میں پیش ہو گا۔</div>
</div>
</body>
</html>
