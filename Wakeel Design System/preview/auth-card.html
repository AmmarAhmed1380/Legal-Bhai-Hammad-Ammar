<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;background:var(--background);}
  body{padding:22px;}
  .card{max-width:520px;margin:0 auto;background:#fff;border:1px solid var(--border);border-radius:18px;padding:22px;box-shadow:var(--shadow-card);}
  .eyebrow{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.12em;color:var(--primary);}
  h1{font-size:22px;font-weight:600;margin:8px 0 6px;}
  p{font-size:13px;line-height:20px;color:var(--fg2);margin:0 0 14px;}
  .hint{background:#FBFAF7;border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-size:12px;color:var(--fg2);}
  .hint strong{color:var(--fg1);display:block;margin-bottom:2px;}
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow">WAKEEL DEMO</div>
  <h1>Islamabad + Rawalpindi lawyer workflow</h1>
  <p>Demo auth is fixed to seeded accounts. This surface is for firm admin, assignment, sync, and client share-link walkthroughs.</p>
  <div class="hint"><strong>Demo code</strong>111111</div>
</div>
</body>
</html>
