<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;background:var(--surface);}
  body{padding:22px;display:flex;flex-direction:column;gap:12px;max-width:560px;}
  .field{display:flex;flex-direction:column;gap:6px;}
  label{font-size:12px;color:var(--fg2);font-weight:600;}
  input,select,textarea{padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:#fff;font-family:var(--font-sans);font-size:14px;color:var(--fg1);}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--primary);outline-offset:1px;border-color:var(--primary);}
  .row{display:flex;gap:10px;align-items:center;}
  .chip{padding:10px 14px;border-radius:9999px;background:#fff;border:1px solid var(--border);font-size:13px;font-weight:600;color:var(--fg1);}
  .chip.active{background:var(--primary);color:#fff;border-color:var(--primary);}
</style>
</head>
<body>
<div class="field"><label>Case number</label><input value="W.P. 2076/2019"/></div>
<div class="field"><label>Court</label><select><option>Islamabad High Court</option></select></div>
<div class="row"><span class="chip active">Live</span><span class="chip">Demo</span><span class="chip">All</span></div>
</body>
</html>
