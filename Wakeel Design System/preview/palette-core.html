<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;background:var(--surface);}
  body{padding:20px;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .sw{display:flex;flex-direction:column;border-radius:10px;overflow:hidden;border:1px solid var(--border);}
  .chip{height:56px;}
  .meta{padding:8px 10px;display:flex;flex-direction:column;gap:2px;background:var(--surface);}
  .name{font-weight:600;font-size:12px;color:var(--fg1);}
  .hex{font-family:var(--font-mono);font-size:10.5px;color:var(--fg2);}
</style>
</head>
<body>
<div class="grid">
  <div class="sw"><div class="chip" style="background:#0F6E56"></div><div class="meta"><span class="name">Primary</span><span class="hex">#0F6E56</span></div></div>
  <div class="sw"><div class="chip" style="background:#08503F"></div><div class="meta"><span class="name">Primary Dark</span><span class="hex">#08503F</span></div></div>
  <div class="sw"><div class="chip" style="background:#E1F5EE"></div><div class="meta"><span class="name">Primary Light</span><span class="hex">#E1F5EE</span></div></div>
  <div class="sw"><div class="chip" style="background:#D85A30"></div><div class="meta"><span class="name">Accent / Danger</span><span class="hex">#D85A30</span></div></div>
  <div class="sw"><div class="chip" style="background:#FAECE7"></div><div class="meta"><span class="name">Accent Light</span><span class="hex">#FAECE7</span></div></div>
  <div class="sw"><div class="chip" style="background:#D97706"></div><div class="meta"><span class="name">Warning (amber)</span><span class="hex">#D97706</span></div></div>
</div>
</body>
</html>
