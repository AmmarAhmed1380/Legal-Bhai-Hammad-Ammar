<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;background:var(--background);}
  body{padding:22px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .stat{background:var(--primary-light);border-radius:14px;padding:16px 14px;}
  .n{font-size:28px;font-weight:700;color:var(--primary-dark);line-height:1;}
  .l{font-size:12px;color:var(--fg2);margin-top:6px;}
</style>
</head>
<body>
<div class="stat"><div class="n">12</div><div class="l">Total cases</div></div>
<div class="stat"><div class="n">3</div><div class="l">Hearings today</div></div>
<div class="stat" style="background:#FAECE7"><div class="n" style="color:#D85A30">1</div><div class="l">Conflicts</div></div>
<div class="stat"><div class="n">4</div><div class="l">Assigned lawyers</div></div>
</body>
</html>
