<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;background:var(--background);}
  body{padding:20px;display:flex;flex-direction:column;gap:12px;}
  .card{background:#fff;border:1px solid var(--border);border-left:4px solid var(--primary);border-radius:14px;padding:16px;box-shadow:var(--shadow-card);display:flex;flex-direction:column;gap:6px;max-width:620px;}
  .card.conflict{border-left-color:var(--accent);}
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .num{font-family:var(--font-mono);font-size:15px;font-weight:700;color:var(--fg1);}
  .title{font-size:14px;color:var(--fg2);line-height:20px;}
  .meta{font-size:11px;color:var(--fg3);}
  .pill{display:inline-flex;align-items:center;padding:5px 10px;border-radius:6px;font-size:11px;font-weight:700;}
  .live{background:#E1F5EE;color:#08503F;}
  .demo{background:#F4EEE0;color:#7A5B18;}
  .conf{background:#FAECE7;color:#D85A30;}
</style>
</head>
<body>
<div class="card">
  <div class="top"><span class="num">W.P. 2076/2019</span><span class="pill live">IHC Live</span></div>
  <div class="title">Redtone Telecommunications Pak Pvt Ltd v CIR etc</div>
  <div class="meta">Islamabad High Court · arguments · Next 14 May</div>
</div>
<div class="card conflict">
  <div class="top"><span class="num">Civil Suit 201/2026</span><span class="pill conf">Conflict</span></div>
  <div class="title">Noor Enterprises v Al-Hamd Traders</div>
  <div class="meta">Islamabad District Court East · 09:30 AM · District Demo</div>
</div>
</body>
</html>
