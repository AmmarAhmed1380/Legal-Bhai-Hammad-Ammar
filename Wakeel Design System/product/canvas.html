<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<title>Wakeel · Product Design Canvas</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  html,body { margin:0; font-family: var(--font-sans); }
  .phone-ios { width: 100%; height: 100%; background: var(--background); position: relative; overflow: hidden; }
  .phone-android { width: 100%; height: 100%; background: var(--background); position: relative; overflow: hidden; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="./design-canvas.jsx"></script>
<script type="text/babel" src="./atoms.jsx"></script>
<script type="text/babel" src="./screens/m-onboarding.jsx"></script>
<script type="text/babel" src="./screens/m-case-detail.jsx"></script>
<script type="text/babel" src="./screens/d-onboarding-sync.jsx"></script>
<script type="text/babel" src="./screens/m-home.jsx"></script>
<script type="text/babel" src="./screens/m-cases-calendar.jsx"></script>
<script type="text/babel" src="./screens/m-more.jsx"></script>
<script type="text/babel" src="./screens/d-shell.jsx"></script>
<script type="text/babel" src="./screens/d-cases-calendar.jsx"></script>
<script type="text/babel" src="./screens/d-ops.jsx"></script>
<script type="text/babel" src="./screens/c-portal.jsx"></script>
<script type="text/babel" src="./screens/mkt-landing.jsx"></script>
<script type="text/babel">
const { useEffect } = React;

function Frame({ children, style }) {
  return <div style={{ width: "100%", height: "100%", background: "var(--background)", position: "relative", overflow: "hidden", ...(style||{}) }}>{children}</div>;
}

function App() {
  useEffect(() => {
    const t = setInterval(() => lucide.createIcons(), 300);
    return () => clearInterval(t);
  }, []);

  return (
    <DesignCanvas>
      <DCSection id="phase1-roadmap" title="Phase 1 · Foundations" subtitle="Canvas established. Onboarding + case detail + court sync. Phases 2–7 extend across sittings.">
        <DCArtboard id="plan" label="00 · Roadmap" width={520} height={700}>
          <div style={{ padding: 32, height: "100%", background: "var(--background)", boxSizing: "border-box", overflow: "auto" }}>
            <div style={{ fontSize: 10, fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.12em", color: "var(--primary)" }}>WAKEEL · FULL PRODUCT</div>
            <div style={{ fontFamily: "var(--font-display)", fontSize: 26, fontWeight: 600, letterSpacing: "-0.015em", marginTop: 10, lineHeight: 1.3, paddingBottom: 8 }}>~40 screens, shipped in 7 phases.</div>
            <div style={{ fontSize: 13, color: "var(--fg2)", marginTop: 22, lineHeight: "20px" }}>Each phase appends to this canvas. Focus any card to preview fullscreen.</div>
            <div style={{ marginTop: 20, display: "flex", flexDirection: "column", gap: 10 }}>
              {[
                ["Phase 1", "Foundations", "Canvas, atoms, bilingual toggle, onboarding (mobile + web), case detail (full), court sync (PK-wide)"],
                ["Phase 2", "Mobile completion", "Home, cases list, calendar, alerts, vault, time, chat, settings — iOS + Android parity"],
                ["Phase 3", "Dashboard completion", "Cases, calendar, time/invoicing, clients, admin, search, reports", "done"],
                ["Phase 4", "Client portal", "Multi-case home, chat thread, doc viewer", "done"],
                ["Phase 5", "Marketing", "Landing page — Pakistan-rooted", "done"],
                ["Phase 6", "Pitch deck", "Stakeholder walkthrough"],
                ["Phase 7", "Handoff", "Engineering spec bundle"],
              ].map(([p, name, desc, flag], i) => {
                const done = i <= 1 || flag === "done";
                const building = flag === "live";
                return (
                <div key={i} style={{ background: "#fff", border: "1px solid var(--border)", borderRadius: 12, padding: 14, display: "flex", gap: 12, alignItems: "flex-start" }}>
                  <div style={{ width: 56, flex: "none", fontFamily: "var(--font-mono)", fontSize: 11, fontWeight: 700, color: done || building ? "var(--primary)" : "var(--fg3)", marginTop: 2 }}>{p}</div>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: 14, fontWeight: 700, color: "var(--fg1)" }}>{name}</div>
                    <div style={{ fontSize: 12, color: "var(--fg2)", lineHeight: "17px", marginTop: 3 }}>{desc}</div>
                  </div>
                  {done && <PPill tone="live" size="sm">done</PPill>}
                  {building && <PPill tone="warn" size="sm">building</PPill>}
                </div>
              );})}
            </div>
          </div>
        </DCArtboard>
      </DCSection>

      <DCSection id="mobile-onboarding" title="Mobile · Onboarding" subtitle="Firm signup wizard · iOS + Android parity">
        <DCArtboard id="ios-signup" label="iOS · Firm signup" width={390} height={700}>
          <Frame><MFirmSignup platform="ios"/></Frame>
        </DCArtboard>
        <DCArtboard id="ios-invite" label="iOS · Invite team" width={390} height={700}>
          <Frame><MInviteTeam platform="ios"/></Frame>
        </DCArtboard>
        <DCArtboard id="android-signup" label="Android · Firm signup" width={390} height={700}>
          <Frame><MFirmSignup platform="android"/></Frame>
        </DCArtboard>
        <DCArtboard id="android-invite" label="Android · Invite team" width={390} height={700}>
          <Frame><MInviteTeam platform="android"/></Frame>
        </DCArtboard>
      </DCSection>

      <DCSection id="mobile-case" title="Mobile · Case detail" subtitle="Full case view — 5 tabs, iOS shown (Android parity in phase 2)">
        <DCArtboard id="case-overview" label="Overview tab" width={390} height={700}>
          <Frame><MCaseDetail tab="overview"/></Frame>
        </DCArtboard>
        <DCArtboard id="case-hearings" label="Hearings tab" width={390} height={700}>
          <Frame><MCaseDetail tab="hearings"/></Frame>
        </DCArtboard>
        <DCArtboard id="case-docs" label="Documents tab" width={390} height={700}>
          <Frame><MCaseDetail tab="docs"/></Frame>
        </DCArtboard>
        <DCArtboard id="case-time" label="Time tab" width={390} height={700}>
          <Frame><MCaseDetail tab="time"/></Frame>
        </DCArtboard>
        <DCArtboard id="case-chat" label="Chat tab" width={390} height={700}>
          <Frame><MCaseDetail tab="chat"/></Frame>
        </DCArtboard>
      </DCSection>

      <DCSection id="dashboard-foundation" title="Dashboard · Foundations" subtitle="Firm signup and Pakistan-wide court sync">
        <DCArtboard id="d-signup" label="Firm signup (step 1/3)" width={1280} height={780}>
          <Frame><DFirmSignup/></Frame>
        </DCArtboard>
        <DCArtboard id="d-courts" label="Court sync settings" width={1280} height={780}>
          <Frame><DCourtSync/></Frame>
        </DCArtboard>
      </DCSection>

      <DCSection id="mobile-daily" title="Mobile · Daily surfaces" subtitle="Home, cases list, calendar — the three most-used screens">
        <DCArtboard id="m-home" label="Home · today" width={390} height={760}>
          <Frame><MHome/></Frame>
        </DCArtboard>
        <DCArtboard id="m-cases" label="Cases list" width={390} height={760}>
          <Frame><MCasesList/></Frame>
        </DCArtboard>
        <DCArtboard id="m-calendar" label="Calendar · month" width={390} height={760}>
          <Frame><MCalendar/></Frame>
        </DCArtboard>
        <DCArtboard id="m-home-android" label="Android · Home" width={390} height={760}>
          <Frame><MHome platform="android"/></Frame>
        </DCArtboard>
      </DCSection>

      <DCSection id="mobile-tools" title="Mobile · Tools &amp; communication" subtitle="Alerts, vault, time, chat list, settings">
        <DCArtboard id="m-alerts" label="Alerts" width={390} height={760}>
          <Frame><MAlerts/></Frame>
        </DCArtboard>
        <DCArtboard id="m-vault" label="Document vault" width={390} height={760}>
          <Frame><MVault/></Frame>
        </DCArtboard>
        <DCArtboard id="m-time" label="Time tracking" width={390} height={760}>
          <Frame><MTime/></Frame>
        </DCArtboard>
        <DCArtboard id="m-chat" label="Chat list" width={390} height={760}>
          <Frame><MChatList/></Frame>
        </DCArtboard>
        <DCArtboard id="m-settings" label="Settings" width={390} height={760}>
          <Frame><MSettings/></Frame>
        </DCArtboard>
      </DCSection>
      <DCSection id="dashboard-cases" title="Dashboard · Cases &amp; Calendar" subtitle="Firm-wide roster and hearing schedule. Desktop only — 1440w.">
        <DCArtboard id="d-cases" label="Case roster" width={1280} height={820}>
          <Frame><DCasesRoster/></Frame>
        </DCArtboard>
        <DCArtboard id="d-calendar" label="Week calendar" width={1280} height={820}>
          <Frame><DCalendar/></Frame>
        </DCArtboard>
        <DCArtboard id="d-search" label="Global search · ⌘K" width={1280} height={820}>
          <Frame><DSearch/></Frame>
        </DCArtboard>
      </DCSection>

      <DCSection id="client-portal" title="Client portal" subtitle="Read-only shared by counsel. 820w centered. Opens from SMS link, no account.">
        <DCArtboard id="c-home" label="Portal · matters home" width={900} height={960}>
          <Frame><CPortalHome/></Frame>
        </DCArtboard>
        <DCArtboard id="c-chat" label="Portal · counsel chat" width={900} height={960}>
          <Frame><CPortalChat/></Frame>
        </DCArtboard>
        <DCArtboard id="c-doc" label="Portal · document viewer" width={900} height={960}>
          <Frame><CPortalDocViewer/></Frame>
        </DCArtboard>
      </DCSection>

      <DCSection id="dashboard-ops" title="Dashboard · Operations &amp; admin" subtitle="Time &amp; invoicing, clients, team, reports.">
        <DCArtboard id="d-time" label="Time &amp; invoicing" width={1280} height={820}>
          <Frame><DTimeInvoicing/></Frame>
        </DCArtboard>
        <DCArtboard id="d-clients" label="Clients" width={1280} height={820}>
          <Frame><DClients/></Frame>
        </DCArtboard>
        <DCArtboard id="d-team" label="Team &amp; roles" width={1280} height={820}>
          <Frame><DTeamRoles/></Frame>
        </DCArtboard>
        <DCArtboard id="d-reports" label="Firm analytics" width={1280} height={820}>
          <Frame><DReports/></Frame>
        </DCArtboard>
      </DCSection>
      <DCSection id="marketing" title="Marketing · Landing page" subtitle="Pakistan-rooted. Honest about coverage. Priced in PKR.">
        <DCArtboard id="mkt-landing" label="wakeel.pk landing page" width={1280} height={3400}>
          <Frame><MktLanding/></Frame>
        </DCArtboard>
      </DCSection>

    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
